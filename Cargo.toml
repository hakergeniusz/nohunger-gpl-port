[package]
name = "horizon-nohunger"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "Doesn't let your hunger bar go down. A Horizon native mod ported from Meteor Client."
publish = false

# The runtime doubles as the mod's library (its tests) and the module the
# bundle injects into the game; the helper files compile only inside it.
[lib]
path = "mixins/nohunger/runtime.rs"
